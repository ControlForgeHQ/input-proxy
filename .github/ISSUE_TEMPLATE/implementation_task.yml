name: Implementation task
description: Define a bounded implementation task for input-proxy
title: "[Task]: "
labels:
  - implementation
body:
  - type: markdown
    attributes:
      value: |
        Use this form for small, reviewable implementation tasks.

        Read `AGENTS.md`, `docs/ARCHITECTURE.md`, and
        `docs/ENGINEERING.md` before making changes.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Describe the single outcome this task should achieve.
      placeholder: Implement source-device opening and inspection using libevdev.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: In scope
      description: List the behaviour and files that are part of this task.
      placeholder: |
        - Open the configured evdev source path
        - Initialize a libevdev object
        - Store owned source-device resources
        - Return project result codes
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: List related work that must not be included.
      placeholder: |
        - uinput device creation
        - event forwarding
        - reconnect handling
        - CLI changes
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Record architectural or implementation constraints.
      placeholder: |
        - Preserve the existing public API
        - Do not expose libevdev through public headers
        - Avoid unrelated refactoring
    validations:
      required: true

  - type: textarea
    id: expected_files
    attributes:
      label: Expected files to change
      description: List the files likely to be modified or added.
      placeholder: |
        - src/source_device.c
        - CMakeLists.txt
        - tests/source_device_test.c
    validations:
      required: true

  - type: textarea
    id: protected_files
    attributes:
      label: Files that should not change
      description: List files that are outside the task unless a technical blocker is found.
      placeholder: |
        - src/proxy_session.c
        - src/main.c
        - docs/ARCHITECTURE.md
        - AGENTS.md
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: State the observable conditions required to complete the task.
      placeholder: |
        - Project builds cleanly
        - All new return values use input_proxy_result
        - Source-device resources are cleaned up safely
        - Tests pass
        - No unrelated files are modified
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation notes
      description: Describe required build, test, or hardware validation.
      placeholder: |
        Run:
        cmake -S . -B build
        cmake --build build
        ctest --test-dir build
    validations:
      required: true

  - type: textarea
    id: agent_notes
    attributes:
      label: Agent instructions
      description: Add any task-specific instructions for coding agents.
      placeholder: |
        Preserve the existing architecture.
        If a public API change appears necessary, explain it rather than making it automatically.